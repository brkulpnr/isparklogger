name: Log İSPARK occupancy

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run logger
        run: python logger.py

      - name: Commit and push data
        run: |
          git config user.name "ispark-bot"
          git config user.email "ispark-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "log: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
